# Local MySQL for development. Creates the schema on first start.
#   docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: chatgpt-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chatgpt_clone
    ports:
      - "3307:3306"
    volumes:
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
